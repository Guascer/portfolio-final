<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Oscar Frederiksen — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  html,body{margin:0;padding:0;background:#f3eee5;color:#1a1612;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:inherit}

  /* Liquid glass — adapted from spec */
  .liquid-glass{
    background:rgba(255,255,255,0.06);
    background-blend-mode:luminosity;
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border:none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.18);
    position:relative;
    overflow:hidden;
  }
  .liquid-glass::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1.4px;
    background:linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.18) 80%, rgba(255,255,255,0.55) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
  }

  .lucide{width:1em;height:1em;stroke-width:1.6;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-.15em}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
</script>

<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="character-viewer.jsx"></script>
<script type="text/babel" src="variation-a.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "displayFont": "Fraunces",
  "bodyFont": "Inter",
  "motion": "lively",
  "paletteA": "pastel"
}/*EDITMODE-END*/;

// Lucide-style inline icons (Globe, ArrowRight, Instagram, Twitter, Mail)
const Icon = ({name, size=20}) => {
  const paths = {
    globe: <><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>,
    arrowRight: <><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
    instagram: <><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></>,
    twitter: <><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15 .5 9.5 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></>,
    mail: <><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></>,
  };
  return <svg className="lucide" width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">{paths[name]}</svg>;
};
window.Icon = Icon;

// Hero image — responsive: mobile portrait / desktop landscape
function HeroVideo() {
  return (
    <picture style={{position:"absolute",inset:0,width:"100%",height:"100%",display:"block"}}>
      <source media="(max-width: 768px)" srcSet="assets/hero-mobile.png"/>
      <img
        src="assets/hero.png"
        alt="Hi, I'm Oscar."
        style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",objectPosition:"center"}}
      />
    </picture>
  );
}
window.HeroVideo = HeroVideo;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => {
    let raf;
    const check = () => {
      if (window.VariationA && window.PORTFOLIO && window.THREE && window.GLTFLoader) setReady(true);
      else raf = requestAnimationFrame(check);
    };
    check();
    return () => raf && cancelAnimationFrame(raf);
  }, []);

  if (!ready) {
    return <div style={{padding:40,fontFamily:"'Fraunces',serif",fontSize:24,fontStyle:"italic"}}>Loading…</div>;
  }

  return (
    <>
      <window.VariationA tweaks={t} HeroOverride={HeroVideo}/>

      <TweaksPanel>
        <TweakSection label="Typography"/>
        <TweakSelect label="Display font" value={t.displayFont}
          options={["Fraunces","Instrument Serif","DM Serif Display"]}
          onChange={(v)=>setTweak("displayFont", v)}/>
        <TweakSelect label="Body font" value={t.bodyFont}
          options={["Inter","Manrope","Space Grotesk"]}
          onChange={(v)=>setTweak("bodyFont", v)}/>

        <TweakSection label="Motion"/>
        <TweakRadio label="Animation" value={t.motion}
          options={["calm","lively","wild"]}
          onChange={(v)=>setTweak("motion", v)}/>

        <TweakSection label="Color scheme"/>
        <TweakRadio label="Palette" value={t.paletteA}
          options={["pastel","citrus","candy"]}
          onChange={(v)=>setTweak("paletteA", v)}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
